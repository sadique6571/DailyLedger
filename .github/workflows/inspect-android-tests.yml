name: Inspect Android test failure

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed APK workflow run ID (blank selects the latest failure)
        required: false
        type: string
  push:
    branches: [codex/inspect-android-tests]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    if: inputs.run_id != 'signing-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read saved Android test reports
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$FAILED_RUN" ]; then
            FAILED_RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-apk.yml --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$FAILED_RUN"
          gh run view "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed-build.log"
          python3 - "$RUNNER_TEMP/failed-build.log" <<'PYLOG'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text().splitlines()
          errors = [line for line in lines if re.search(r'Traceback|RuntimeError|ValueError|KeyError|StopIteration|File .*rotate-signing|Signing certificate|apksigner|FAILED|What went wrong:|Execution failed for task|FAILURE:|error:', line) and ' w: ' not in line]
          for line in errors[-20:]:
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Failed build log::' + safe)
          PYLOG
          gh run download "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --name DailyLedger-test-reports --dir "$RUNNER_TEMP/prior-test-reports"
          python3 tests/report-device-failures.py "$RUNNER_TEMP/prior-test-reports"

  signing-probe:
    if: inputs.run_id == 'signing-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DAILYLEDGER_SIGNING_STORE_PASSWORD: ${{ secrets.DAILYLEDGER_SIGNING_STORE_PASSWORD }}
      DAILYLEDGER_SIGNING_KEY_ALIAS: ${{ secrets.DAILYLEDGER_SIGNING_KEY_ALIAS }}
      DAILYLEDGER_SIGNING_KEY_PASSWORD: ${{ secrets.DAILYLEDGER_SIGNING_KEY_PASSWORD }}
      DAILYLEDGER_NEXT_SIGNING_STORE_PASSWORD: ${{ secrets.DAILYLEDGER_NEXT_SIGNING_STORE_PASSWORD }}
      DAILYLEDGER_NEXT_SIGNING_KEY_ALIAS: ${{ secrets.DAILYLEDGER_NEXT_SIGNING_KEY_ALIAS }}
      DAILYLEDGER_NEXT_SIGNING_KEY_PASSWORD: ${{ secrets.DAILYLEDGER_NEXT_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore private signing material
        env:
          DAILYLEDGER_SIGNING_KEYSTORE_BASE64: ${{ secrets.DAILYLEDGER_SIGNING_KEYSTORE_BASE64 }}
        run: python3 tools/restore-signing.py
      - name: Read previously verified APK for tooling check
        run: gh run download 40823572160 --repo "$GITHUB_REPOSITORY" --name DailyLedger-APK --dir "$RUNNER_TEMP/signing-probe"
      - name: Verify runner signing report format without rebuilding the app
        env:
          DAILYLEDGER_NEXT_SIGNING_KEYSTORE_BASE64: ${{ secrets.DAILYLEDGER_NEXT_SIGNING_KEYSTORE_BASE64 }}
          DAILYLEDGER_SIGNING_LINEAGE_BASE64: ${{ secrets.DAILYLEDGER_SIGNING_LINEAGE_BASE64 }}
        run: |
          python3 - <<'PYPROBE'
          import importlib.util, os, pathlib, sys
          spec=importlib.util.spec_from_file_location('rotate', 'tools/rotate-signing.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          original=module.command
          def command(*args):
              output=original(*args)
              if len(args)>1 and args[1]=='verify':
                  for line in output.decode().splitlines():
                      if 'SHA-256' in line and 'certificate' in line:
                          safe=line.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                          print('::notice title=Public signing report::'+safe)
              return output
          module.command=command
          print('Signing tool:', module.find_apksigner())
          sys.argv=['rotate-signing.py','--apk',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'signing-probe/DailyLedger.apk')]
          try:
              module.main()
              print('::notice title=Signing tooling::Private-key signing and both supported SDK ranges verified.')
          except Exception as error:
              safe=str(error).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Signing tooling::'+safe)
              raise
          PYPROBE
      - name: Remove signing probe material
        if: always()
        run: rm -f "$RUNNER_TEMP/dailyledger-signing.p12" "$RUNNER_TEMP/dailyledger-legacy-release.apk"
