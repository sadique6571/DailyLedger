name: Original ZIP UI preview only
on:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare untouched ZIP source with preview harness
        run: python3 docs/zip-preview/prepare.py
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash docs/zip-preview/capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Original-ZIP-UI-preview
          path: |
            ui-previews/
            app/build/reports/androidTests/
          retention-days: 14
