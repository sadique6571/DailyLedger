name: Import private DailyLedger signing secrets

on:
  workflow_dispatch:
  push:
    branches: [codex/private-app-keys]
    paths:
      - '.github/workflows/import-signing-secrets.yml'
      - 'tools/signing-bootstrap.py'
      - 'signing/bootstrap.enc.json'

permissions:
  contents: read
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check owner-supplied bootstrap token
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.DAILYLEDGER_SIGNING_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$BOOTSTRAP_TOKEN" ]; then
            echo '::error::Add the existing PAT as repository Actions secret DAILYLEDGER_SIGNING_BOOTSTRAP_TOKEN, then re-run this workflow.'
            exit 1
          fi
      - name: Install authenticated encryption dependency
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Test encrypted signing bundle handling
        run: python3 -m unittest discover -s tests -p 'test_signing_bootstrap.py'
      - name: Import private signing secrets without printing values
        env:
          DAILYLEDGER_SIGNING_BOOTSTRAP_TOKEN: ${{ secrets.DAILYLEDGER_SIGNING_BOOTSTRAP_TOKEN }}
        run: python3 tools/signing-bootstrap.py --bundle signing/bootstrap.enc.json --repo "$GITHUB_REPOSITORY"
      - name: Start APK verification build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
